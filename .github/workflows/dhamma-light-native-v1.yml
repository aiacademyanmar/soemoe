name: Dhamma Light Native APK
on:
  push:
    branches: [dhamma-light-native-v1]
    paths:
      - 'dhamma-light/**'
      - '.github/workflows/dhamma-light-native-v1.yml'
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble Dhamma Light APK
        working-directory: dhamma-light
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhamma-Light-Native-V1-APK
          path: dhamma-light/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
