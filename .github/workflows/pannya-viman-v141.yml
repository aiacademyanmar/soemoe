name: Pannya Viman V1.4.1 Android APK
on:
  push:
    branches: [pannya-viman-v14-apk-build]
    paths: [.github/workflows/pannya-viman-v141.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Get V1.4.1 Android project
        run: |
          curl -fLSs --retry 3 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1EUEXhzhlEDac1vOGNfxlbtymtIHCeFfR' -o source.zip
          echo '5564304098d96319ca9c6f26246444e6c5dc90f437c0f79e0a3db32531f2df68  source.zip' | sha256sum -c -
          mkdir android && cd android && unzip -q ../source.zip
          python3 scripts/preflight.py
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -3
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PannyaViman-V1.4.1-Booklib-Native-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
