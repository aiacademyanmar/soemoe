name: Buddha Psychology V1.6.5 Original UI + Logo + Single Ad
on:
  push:
    branches: [build/buddha-psychology-v165-original-ui-single-ad]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Retrieve original source and approved logo
        run: |
          python3 -m pip install --disable-pip-version-check gdown==5.2.0 pillow
          gdown "https://drive.google.com/uc?id=1P0QD_9YsdN_vtvvOWGVStVIMnMwxnu84" -O source.zip
          gdown "https://drive.google.com/uc?id=17RwpT25IIcyyuC0HFsiRWIqd4naoQhy5" -O approved_logo.png
          python3 - <<'PY'
          import zipfile,hashlib
          with zipfile.ZipFile("source.zip") as z:
            assert z.testzip() is None
            z.extractall("project")
          assert hashlib.sha256(open("approved_logo.png","rb").read()).hexdigest()=="7012686201856cddb04ee9ae6bd333bf5b85025e3a04fe9c8b135637a69fdfee"
          PY
      - name: Patch original Android UI without redesign
        env:
          AAII_CENTRAL_ADMIN_URL: ${{ vars.AAII_CENTRAL_ADMIN_URL }}
        run: python3 patch_original.py
      - name: Compile actual original Android project
        working-directory: project/BuddhaPsychologyNative_V1_6_5
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify offline content
        run: |
          set -euo pipefail
          APK=project/BuddhaPsychologyNative_V1_6_5/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("project/BuddhaPsychologyNative_V1_6_5/app/build/outputs/apk/debug/app-debug.apk") as z:
            assert z.testzip() is None
            assert len([s for s in z.namelist() if s.startswith("assets/audio/track_") and s.endswith(".mp3")])==9
            assert "assets/book.pdf" in z.namelist()
          PY
          sha256sum "$APK" > project/BuddhaPsychologyNative_V1_6_5/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Buddha-Psychology-V1.6.5-Original-UI-Logo-One-Ad
          path: |
            project/BuddhaPsychologyNative_V1_6_5/app/build/outputs/apk/debug/app-debug.apk
            project/BuddhaPsychologyNative_V1_6_5/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
