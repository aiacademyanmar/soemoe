name: Pannya Viman V2.0 Native FM Cassette YouTube
on:
  push:
    branches: [pannya-viman-v20-fm-cassette]
    paths: [.github/workflows/pannya-viman-v20.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download verified source
        run: |
          curl -fLsS --retry 4 --retry-delay 3 --max-time 180 'https://drive.google.com/uc?export=download&id=1BnIXLBW9GZpySgWtgo7PS76_7BoHBdY3' -o source.zip
          echo '728ffe6b2d62c4d445369278a153200a56c1b72e015b7ffcd4dac962d93d403a  source.zip' | sha256sum -c -
          unzip -q source.zip
          python3 PannyaViman-V1.9-YouTube-Playlist-Android/scripts/preflight.py
          grep -q "versionName '2.0.0'" PannyaViman-V1.9-YouTube-Playlist-Android/app/build.gradle
          grep -q 'class TapeDeckView' PannyaViman-V1.9-YouTube-Playlist-Android/app/src/main/java/asia/aaii/pannyaviman/TapeDeckView.java
      - name: Build APK
        working-directory: PannyaViman-V1.9-YouTube-Playlist-Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify
        run: |
          unzip -t PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/app-debug.apk | tail -3
          sha256sum PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/app-debug.apk > PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PannyaViman-V2.0-FM-Cassette-YouTube-APK
          path: |
            PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/app-debug.apk
            PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
