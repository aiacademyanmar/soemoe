name: Build Patthana Native Android APK
on:
  push:
    branches:
      - patthana-android-v1-apk
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project archive
        uses: actions/checkout@v4
      - name: Unpack Patthana Android source and 40 A5 pages
        run: tar -xJf Patthana_Source_V1.tar.xz
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Native Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload compiled APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Patthana-Alin-Native-Android-V1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
