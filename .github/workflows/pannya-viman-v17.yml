name: Pannya Viman V1.7 Suno Music Native APK
on:
  push:
    branches: [pannya-viman-v17-suno]
    paths: [.github/workflows/pannya-viman-v17.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download Pannya Viman V1.7 native source
        run: |
          curl -fLSs --retry 3 --retry-delay 3 'https://drive.google.com/uc?export=download&id=1kLEjj0LTdg4Hybp3eyiLpzJhsBJxObJc' -o source.zip
          echo '5ef39f4da7d5491ed92941c727dca14950112b78efd208b2dbc373304509313d  source.zip' | sha256sum -c -
          unzip -q source.zip
          python3 android/scripts/preflight.py
          grep -q "versionName '1.7.0'" android/app/build.gradle
          grep -q 'void sunoMusic()' android/app/src/main/java/asia/aaii/pannyaviman/MainActivity.java
          grep -q 'class SunoPlayerActivity' android/app/src/main/java/asia/aaii/pannyaviman/SunoPlayerActivity.java
      - name: Build native Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -3
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PannyaViman-V1.7-SunoMusic-Native-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
