name: Build AAII Music Creator APK
on:
  push:
    branches: [music-creator-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK diagnostic
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -print || true
      - name: Compile Android app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-Music-Creator-Samsung-CrashFix-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
