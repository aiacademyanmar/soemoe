name: Pannya Viman V2.3 Lite UI Native APK
on:
  push:
    branches: [pannya-viman-v23-lite-ui]
    paths: [.github/workflows/pannya-viman-v23-lite.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download verified V2.3 source
        run: |
          curl -fLsS --retry 4 --retry-delay 3 --max-time 180 'https://drive.google.com/uc?export=download&id=1Fe0Ja4KMx8VIv7hEyncxHcNKHSmkBn-w' -o source.zip
          echo 'fe074a4907f2e64e01432be49404d75b742d7f92f5e3bff6f6a887bea6e32054  source.zip' | sha256sum -c -
          unzip -q source.zip
          python3 PannyaViman-V2.3-Lite-Android/scripts/preflight.py
          grep -q "versionName '2.3.0'" PannyaViman-V2.3-Lite-Android/app/build.gradle
          grep -q 'void createFooter()' PannyaViman-V2.3-Lite-Android/app/src/main/java/asia/aaii/pannyaviman/MainActivity.java
          test -f PannyaViman-V2.3-Lite-Android/app/src/main/res/drawable/lite_bagan_banner.webp
      - name: Build installable APK
        working-directory: PannyaViman-V2.3-Lite-Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s PannyaViman-V2.3-Lite-Android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t PannyaViman-V2.3-Lite-Android/app/build/outputs/apk/debug/app-debug.apk | tail -3
          sha256sum PannyaViman-V2.3-Lite-Android/app/build/outputs/apk/debug/app-debug.apk | tee PannyaViman-V2.3-Lite-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          wc -c PannyaViman-V2.3-Lite-Android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload lite APK
        uses: actions/upload-artifact@v4
        with:
          name: PannyaViman-V2.3-Lite-UI-APK
          path: |
            PannyaViman-V2.3-Lite-Android/app/build/outputs/apk/debug/app-debug.apk
            PannyaViman-V2.3-Lite-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
