name: AAII School V2.6 Native Builds and Pilot Tests
on:
  push:
    branches: [school-v2-6-guardian-replay]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Retrieve checksum-verified Android source
        run: |
          python3 -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1WLwCfFVIhw2lYJAg1v3NIMT-ug6ErxLA' -O source-android.zip
          echo '4365020aeea1c8518798bd3136f804917889dfd8f9735389d8795298e31330d2  source-android.zip' | sha256sum --check
          unzip -q source-android.zip
      - name: Compile native Android APK
        run: gradle --no-daemon -p AAII_School_Android_Native_V2.6 assembleDebug
      - name: Verify APK and checksum
        run: |
          test -s AAII_School_Android_Native_V2.6/app/build/outputs/apk/debug/app-debug.apk
          sha256sum AAII_School_Android_Native_V2.6/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-School-V2.6-Android-Debug-APK
          path: AAII_School_Android_Native_V2.6/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Retrieve checksum-verified Windows source
        shell: pwsh
        run: |
          python -m pip install --quiet gdown
          python -m gdown 'https://drive.google.com/uc?id=1TeP-nzx8HqX5cyJWyq-pasNs4OeKaEGQ' -O windows-v26.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          $expected='56d34f5740d88ab4f948bbc83d3edb372866bfd34190ca323b7bd2986cc79857'
          $actual=(Get-FileHash windows-v26.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Checksum mismatch: $actual" }
          Expand-Archive -Path windows-v26.zip -DestinationPath .
      - name: Native Win32 unit tests + compile
        shell: pwsh
        run: |
          Set-Location AAII_School_Windows_Native_V2.6/src
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o AAII_School_Windows_Native_V2.6_x64.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows compile failed' }
      - name: Windows GUI startup smoke test
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'AAII_School_Windows_Native_V2.6/src/AAII_School_Windows_Native_V2.6_x64.exe').Path
          $env:AAII_SMS_DATA_DIR=Join-Path $env:RUNNER_TEMP 'aaii-school-v26-smoke'
          New-Item -ItemType Directory -Path $env:AAII_SMS_DATA_DIR -Force | Out-Null
          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "GUI process closed unexpectedly $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output 'Native Win32 process startup PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-School-V2.6-Windows-Native-EXE
          path: AAII_School_Windows_Native_V2.6/src/AAII_School_Windows_Native_V2.6_x64.exe
