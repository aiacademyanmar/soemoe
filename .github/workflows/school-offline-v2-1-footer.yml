name: AAII School Offline V2.1 Footer Safe APK
on:
  push:
    branches: [school-offline-21-modules-v2-1-footer]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download verified source from project Drive
        run: |
          python3 -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1ie8Wa4hLcX1fNSaxRVVQ_Zb0iy7so7o7' -O school-v2-1-source.zip
          echo '398ac2c7277020721ab53af6e6013a7db03e94ab47e33c60bd942dd9b01e9ca9  school-v2-1-source.zip' | sha256sum --check
          unzip -q school-v2-1-source.zip
      - name: Compile native APK
        run: gradle --no-daemon -p AAII_School_Offline_21Modules_V2.1_FooterSafe assembleDebug
      - name: Verify final APK
        run: |
          test -s AAII_School_Offline_21Modules_V2.1_FooterSafe/app/build/outputs/apk/debug/app-debug.apk
          sha256sum AAII_School_Offline_21Modules_V2.1_FooterSafe/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-School-Offline-21Modules-V2.1-FooterSafe-APK
          path: AAII_School_Offline_21Modules_V2.1_FooterSafe/app/build/outputs/apk/debug/app-debug.apk
