name: Pannya Viman V2.2 Smart Native Audio APK
on:
  push:
    branches: [pannya-viman-v22-smart-audio]
    paths: [.github/workflows/pannya-viman-v22.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download and check V2.2 source
        run: |
          curl -fLsS --retry 4 --retry-delay 3 --max-time 180 'https://drive.google.com/uc?export=download&id=1_5jtDbDcioZzDll6-UtThR0HsbU6wrUW' -o source.zip
          echo 'b1bfdeb1f4ac982b05ad904d99fa0dc59cb476813d2ecd82359fdbdbe41ea8a6  source.zip' | sha256sum -c -
          unzip -q source.zip
          python3 PannyaViman-V2.2-Android/scripts/preflight.py
          grep -q "versionName '2.2.0'" PannyaViman-V2.2-Android/app/build.gradle
          grep -q 'CYCLE_SLEEP' PannyaViman-V2.2-Android/app/src/main/java/asia/aaii/pannyaviman/AudioPlaybackService.java
          grep -q 'SHUFFLE' PannyaViman-V2.2-Android/app/src/main/java/asia/aaii/pannyaviman/NativeDrivePlayerActivity.java
      - name: Compile Native APK
        working-directory: PannyaViman-V2.2-Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify compiled APK
        run: |
          test -s PannyaViman-V2.2-Android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t PannyaViman-V2.2-Android/app/build/outputs/apk/debug/app-debug.apk | tail -3
          sha256sum PannyaViman-V2.2-Android/app/build/outputs/apk/debug/app-debug.apk | tee PannyaViman-V2.2-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PannyaViman-V2.2-SmartAudio-Native-APK
          path: |
            PannyaViman-V2.2-Android/app/build/outputs/apk/debug/app-debug.apk
            PannyaViman-V2.2-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
