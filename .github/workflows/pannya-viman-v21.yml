name: Pannya Viman V2.1 Background Audio Native APK
on:
  push:
    branches: [pannya-viman-v21-background-audio]
    paths: [.github/workflows/pannya-viman-v21.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download verified V2.1 source
        run: |
          curl -fLsS --retry 4 --retry-delay 3 --max-time 180 'https://drive.google.com/uc?export=download&id=1HmVCeR0DHTe8I8JJHz796aA5Om_HasIx' -o source.zip
          echo '341b70ee3ca96dd1ec894d0459402d2a6a198d7bcdc514f843c6c698e71c6f12  source.zip' | sha256sum -c -
          unzip -q source.zip
          python3 PannyaViman-V1.9-YouTube-Playlist-Android/scripts/preflight.py
          grep -q "versionName '2.1.0'" PannyaViman-V1.9-YouTube-Playlist-Android/app/build.gradle
          grep -q 'foregroundServiceType="mediaPlayback"' PannyaViman-V1.9-YouTube-Playlist-Android/app/src/main/AndroidManifest.xml
          grep -q 'class AudioPlaybackService' PannyaViman-V1.9-YouTube-Playlist-Android/app/src/main/java/asia/aaii/pannyaviman/AudioPlaybackService.java
      - name: Compile installable Android APK
        working-directory: PannyaViman-V1.9-YouTube-Playlist-Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify ZIP CRC and SHA256
        run: |
          test -s PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/app-debug.apk | tail -3
          sha256sum PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/app-debug.apk > PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PannyaViman-V2.1-Background-Audio-Native-APK
          path: |
            PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/app-debug.apk
            PannyaViman-V1.9-YouTube-Playlist-Android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
