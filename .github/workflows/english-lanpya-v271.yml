name: English LanPya V2.7.1 APK Build Verification

on:
  workflow_dispatch:
  push:
    branches:
      - english-lanpya-v271
    paths:
      - 'english-lanpya/**'
      - '.github/workflows/english-lanpya-v271.yml'

permissions:
  contents: read

jobs:
  native-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: english-lanpya
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Unit Tests and Build Debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify built APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -q "classes.dex"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "COMMIT=$GITHUB_SHA" > app/build/outputs/apk/debug/BUILD_INFO.txt
          echo "RUN=$GITHUB_RUN_ID" >> app/build/outputs/apk/debug/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: EnglishLanPya-V271-Build-QA-Debug-APK
          path: |
            english-lanpya/app/build/outputs/apk/debug/app-debug.apk
            english-lanpya/app/build/outputs/apk/debug/SHA256SUMS.txt
            english-lanpya/app/build/outputs/apk/debug/BUILD_INFO.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: EnglishLanPya-V271-Failure-Reports
          path: english-lanpya/app/build/reports/
          if-no-files-found: ignore
