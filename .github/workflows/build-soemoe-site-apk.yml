name: Soe Moe AI Trainer Website - Android Debug APK

on:
  push:
    branches:
      - feature/soemoe-site-native-apk-v1
    paths:
      - 'website-android/**'
      - '.github/workflows/build-soemoe-site-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: website-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -r | head -1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify metadata SHA256 and signature
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/SoeMoe-AI-Trainer-V1.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/SoeMoe-AI-Trainer-V1.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/SoeMoe-AI-Trainer-V1.0-debug.apk | tee dist/metadata.txt
          sha256sum dist/SoeMoe-AI-Trainer-V1.0-debug.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SoeMoe-AI-Trainer-V1.0-Android-Debug
          path: website-android/dist/
          if-no-files-found: error
          retention-days: 14
