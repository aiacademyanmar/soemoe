name: Sukha Panya V8.2 Design Accurate APK
on:
  push:
    branches: [sukha-v82-pixel-ui-build]
    paths:
      - 'sukha-v82/**'
      - '.github/workflows/sukha-v82-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract native source and 14 design assets
        run: |
          unzip -q sukha-v82/source.zip -d sukha-v82
          test "$(find sukha-v82/android/app/src/main/assets -name 'screen_*.webp' | wc -l)" -eq 14
      - name: Compile Native APK
        working-directory: sukha-v82/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          APK='sukha-v82/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" SukhaPanya_V8_2_DesignMatched_Native_Debug.apk
          sha256sum SukhaPanya_V8_2_DesignMatched_Native_Debug.apk > SukhaPanya_V8_2_DesignMatched_Native_Debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SukhaPanya-V82-DesignMatched-APK
          path: |
            SukhaPanya_V8_2_DesignMatched_Native_Debug.apk
            SukhaPanya_V8_2_DesignMatched_Native_Debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
