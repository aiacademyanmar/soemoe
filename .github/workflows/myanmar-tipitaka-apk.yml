name: Build Myanmar Tipitaka Native APK
on:
  push:
    branches:
      - 'build/myanmar-tipitaka-v1-20261030'
    paths:
      - 'tipitaka-app/**'
      - '.github/workflows/myanmar-tipitaka-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tipitaka-app/**'
      - '.github/workflows/myanmar-tipitaka-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "No sdkmanager installed in $SDK_ROOT"
            exit 1
          fi
          echo "Using $SDK_MANAGER"
          (yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null) || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle full Myanmar-script Mula Tipitaka corpus
        working-directory: tipitaka-app
        run: python3 scripts/build_offline_corpus.py
      - name: Compile APK
        working-directory: tipitaka-app
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Name V1.7 APK
        run: cp tipitaka-app/app/build/outputs/apk/debug/app-debug.apk tipitaka-app/app/build/outputs/apk/debug/Myanmar-Tipitaka-Native-V1.7.apk
      - name: APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-Native-V1.7-Full-Offline-APK
          path: tipitaka-app/app/build/outputs/apk/debug/Myanmar-Tipitaka-Native-V1.7.apk
          if-no-files-found: error
          retention-days: 30
