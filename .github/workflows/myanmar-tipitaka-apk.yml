name: Build Myanmar Tipitaka Native APK
on:
  push:
    branches:
      - 'build/myanmar-tipitaka-v1-20261030'
    paths:
      - 'tipitaka-app/**'
      - '.github/workflows/myanmar-tipitaka-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'tipitaka-app/**'
      - '.github/workflows/myanmar-tipitaka-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: tipitaka-app
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Myanmar-Tipitaka-Native-V1-Debug-APK
          path: tipitaka-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
