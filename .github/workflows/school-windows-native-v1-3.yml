name: AAII School Native Windows V1.3 Build & Smoke Test
on:
  push:
    branches: [school-windows-native-v1-3]
  workflow_dispatch:
jobs:
  windows-native:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Fetch verified native Windows source
        shell: pwsh
        run: |
          python -m pip install --quiet gdown
          python -m gdown 'https://drive.google.com/uc?id=1deH_P03ASeWqU7xz4Iqwn35p9QWUfp9_' -O native-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          $expected = 'eba5f807d0642499dd1205ff77e7bd07c89f1456da81bd4d458a74cdbb4cfc05'
          $actual = (Get-FileHash native-source.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Source checksum mismatch: $actual" }
          Expand-Archive -Path native-source.zip -DestinationPath .
      - name: Compile and test native Windows application
        shell: pwsh
        run: |
          Set-Location src
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go unit tests failed' }
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o AAII_School_Management_Native_V1.3_Windows_x64.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Native EXE compilation failed' }
      - name: Verify native application starts
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'src/AAII_School_Management_Native_V1.3_Windows_x64.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "EXE exited unexpectedly: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Output 'Native Win32 process startup smoke test passed'
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-School-Native-Windows-V1.3-EXE
          path: src/AAII_School_Management_Native_V1.3_Windows_x64.exe
