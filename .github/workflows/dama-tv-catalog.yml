name: DAMA TV YouTube Catalog Extract
on:
  push:
    branches: ["dama-tv-youtube-catalog"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - name: Python packages
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Collect real YouTube video IDs with source attribution
        run: python -u dama_tv_catalog_builder.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DAMA-TV-YouTube-Video-Catalog
          path: dama_tv_catalog/
          if-no-files-found: warn
