name: AAII Learning - Native Android APK Public Build
on:
  workflow_dispatch:
  push:
    branches: [aaii-learning-apk-v3-public]
    paths:
      - 'aaii-learning/**'
      - '.github/workflows/aaii-learning-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -r | head -1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate public-safe course catalog
        run: python3 aaii-learning/validate_catalog.py
      - name: Restore and validate Teacher Soe Moe original portrait
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('aaii-learning/app/src/main/res/drawable-nodpi/soe_moe_original.jpg')
          data=p.read_bytes()
          corrupted='075cb0b14c45898319dfa078e47b94b476c9afb077e2a0dac39a218ce466d3e7'
          corrected='8b3839d58e7f971b64ee2909a41d75123e48a48970dc643d69a0becc14062c2a'
          if hashlib.sha256(data).hexdigest()==corrupted:
              data=data[:108]+bytes([0x73,0x73,0x73])+data[108:]
              p.write_bytes(data)
          assert hashlib.sha256(data).hexdigest()==corrected, 'Portrait file integrity FAILED'
          assert data[:3]==bytes([255,216,255]) and data[-2:]==bytes([255,217]), 'Invalid JPEG markers'
          print('Portrait JPEG restored; sha256:',corrected)
          PY
      - name: Compile real native APK
        run: gradle -p aaii-learning --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK Signature
        run: |
          set -euo pipefail
          APK=aaii-learning/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          sha256sum "$APK" > aaii-learning/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-Learning-V3-Installable-APK
          path: |
            aaii-learning/app/build/outputs/apk/debug/app-debug.apk
            aaii-learning/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
