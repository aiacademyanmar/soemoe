name: AAII Learning - Native Android APK Public Build
on:
  workflow_dispatch:
  push:
    branches: [aaii-learning-apk-v3-public]
    paths:
      - 'aaii-learning/**'
      - '.github/workflows/aaii-learning-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -r | head -1)"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate public-safe course catalog
        run: python3 aaii-learning/validate_catalog.py
      - name: Restore and validate Teacher Soe Moe original portrait
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('aaii-learning/app/src/main/res/drawable-nodpi/soe_moe_original.jpg')
          data=p.read_bytes()
          corrupted='075cb0b14c45898319dfa078e47b94b476c9afb077e2a0dac39a218ce466d3e7'
          corrected='8b3839d58e7f971b64ee2909a41d75123e48a48970dc643d69a0becc14062c2a'
          if hashlib.sha256(data).hexdigest()==corrupted:
              data=data[:108]+bytes([0x73,0x73,0x73])+data[108:]
              p.write_bytes(data)
          assert hashlib.sha256(data).hexdigest()==corrected, 'Portrait file integrity FAILED'
          assert data[:3]==bytes([255,216,255]) and data[-2:]==bytes([255,217]), 'Invalid JPEG markers'
          print('Portrait JPEG restored; sha256:',corrected)
          PY
      - name: Validate Full HD V4.7 artwork
        run: |
          set -e
          printf '%s  %s\n' \
            '1a57bd33984c6f53a3add24c66f0d9b375bcecd6de801bf8620f36f813a47004' 'aaii-learning/app/src/main/res/drawable-nodpi/aaii_logo_v47.webp' \
            'ec879d397c1457e85f680cf30c0697489982b067d06213079de02149ef046ef8' 'aaii-learning/app/src/main/res/drawable-nodpi/aaii_splash_v47.webp' \
            '0f525e479874a5bdeca79d9688c7500b385df4a4b4a8217ec06da6e88dd6a7d1' 'aaii-learning/app/src/main/res/drawable-nodpi/soe_moe_v47_hd.webp' | sha256sum -c -
      - name: Validate required V4.9 interaction wiring
        shell: bash
        run: |
          set -euo pipefail
          APP=aaii-learning/app/src/main/java/asia/aaii/learningpublic/MainActivity.java
          grep -q "AAII LEARNING V4.9" "$APP"
          grep -q "openCertificatesPortal()" "$APP"
          grep -q "profilePopup()" "$APP"
          grep -q "view.postDelayed(" "$APP"
          grep -q "Test Pop Animation + Sound" "$APP"
          test -s aaii-learning/app/src/main/res/raw/aaii_click.wav
      - name: Validate provider category screens and logo assets
        shell: bash
        run: |
          set -euo pipefail
          APP=aaii-learning/app/src/main/java/asia/aaii/learningpublic/MainActivity.java
          grep -q "CORPORATE / COMPANIES" "$APP"
          grep -q "UNIVERSITIES" "$APP"
          grep -q "providerDirectory()" "$APP"
          grep -q "providerBadge" "$APP"
          for asset in google meta googlecloud microsoft adobe university partner; do
            test -s "aaii-learning/app/src/main/res/drawable/provider_${asset}.xml"
          done
      - name: Validate specialization and teacher platform request features
        shell: bash
        run: |
          set -euo pipefail
          APP=aaii-learning/app/src/main/java/asia/aaii/learningpublic/MainActivity.java
          grep -q 'CERTIFICATE • VERIFICATION' "$APP"
          grep -q 'Professional Skill Bridge' "$APP"
          grep -q 'TEACHER REQUEST FORM • V5.2' "$APP"
          grep -q 'PREVIEW & SEND REQUEST' "$APP"
          grep -q 'confirmTeacherRequest' "$APP"
          grep -q 'choose' "$APP" || true
      - name: Verify certificate detail integration
        run: |
          APP=aaii-learning/app/src/main/java/asia/aaii/learningpublic/MainActivity.java
          grep -q 'findLinkedCertificate' "$APP"
          grep -q 'openLinkedCertificate' "$APP"
          grep -q 'Specialization Linked' "$APP"
      - name: Validate V5.4 Native Gallery
        run: |
          APP=aaii-learning/app/src/main/java/asia/aaii/learningpublic/MainActivity.java
          grep -q 'certificateGallery()' "$APP"
          grep -q 'galleryCard' "$APP"
          grep -q 'View Certificate' "$APP"
      - name: Verify V5.5 exact screenshot + native touch areas
        shell: bash
        run: |
          set -euo pipefail
          IMG=aaii-learning/app/src/main/res/drawable-nodpi/aaii_home_exact_v55.webp
          HOME=aaii-learning/app/src/main/java/asia/aaii/learningpublic/ExactHomeActivity.java
          python3 - <<'PY'
          from pathlib import Path
          data=Path('aaii-learning/app/src/main/res/drawable-nodpi/aaii_home_exact_v55.webp').read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP', 'Bad WebP signature'
          assert len(data)>100000, 'Home artwork unexpectedly small'
          print('Native exact screenshot artwork:',len(data),'bytes')
          PY
          test -s "$HOME"
          grep -q 'hotspot(' "$HOME"
          grep -q 'R.drawable.aaii_home_exact_v55' "$HOME"
          grep -q 'ExactHomeActivity.class' aaii-learning/app/src/main/java/asia/aaii/learningpublic/SplashActivity.java
      - name: Validate V5.6 responsive mobile & certificate match
        shell: bash
        run: |
          set -euo pipefail
          HOME=aaii-learning/app/src/main/java/asia/aaii/learningpublic/ExactHomeActivity.java
          MAIN=aaii-learning/app/src/main/java/asia/aaii/learningpublic/MainActivity.java
          grep -q 'FOOTER_SOURCE_Y = 1520' "$HOME"
          grep -q 'footerHotspot' "$HOME"
          grep -q 'soeMoeCourseCertificate' "$MAIN"
          grep -q 'soeMoeRelatedProgramCertificate' "$MAIN"
          grep -q 'Soe Moe Certificate & Teacher Support' "$MAIN"
      - name: Validate responsive mobile home
        shell: bash
        run: |
          set -euo pipefail
          HOME=aaii-learning/app/src/main/java/asia/aaii/learningpublic/MobileHomeActivity.java
          test -s "$HOME"
          grep -q 'private void footer' "$HOME"
          grep -q 'private void programs' "$HOME"
          grep -q 'private void quickLinks' "$HOME"
          grep -q 'private void providers' "$HOME"
          grep -q 'personal_credentials' "$HOME"
          grep -q 'MobileHomeActivity.class' aaii-learning/app/src/main/java/asia/aaii/learningpublic/SplashActivity.java
          grep -q 'MobileHomeActivity.class' aaii-learning/app/src/main/java/asia/aaii/learningpublic/MainActivity.java
          grep -q 'MobileHomeActivity' aaii-learning/app/src/main/AndroidManifest.xml
      - name: Compile real native APK
        run: gradle -p aaii-learning --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK Signature
        run: |
          set -euo pipefail
          APK=aaii-learning/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          sha256sum "$APK" > aaii-learning/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-Learning-V5.7-Responsive-Native-APK
          path: |
            aaii-learning/app/build/outputs/apk/debug/app-debug.apk
            aaii-learning/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
