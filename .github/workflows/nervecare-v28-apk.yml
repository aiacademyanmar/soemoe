name: NerveCare MM V2.8 APK - Build Preview
on:
  push:
    branches: [nervecare-mm-v28]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/nervecare-mm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Record SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nervecare-mm-v28-build-preview
          path: |
            projects/nervecare-mm/app/build/outputs/apk/debug/app-debug.apk
            projects/nervecare-mm/app/build/outputs/apk/debug/SHA256.txt
      - name: Release prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nervecare-mm-v2.8-build-preview app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SHA256.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "NerveCare MM V2.8 - Build Preview (not full app)" --notes "Small build verification preview. Not the full V2.8 56-route release; medical content is placeholder only." || gh release upload nervecare-mm-v2.8-build-preview app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SHA256.txt --clobber --repo "$GITHUB_REPOSITORY"
