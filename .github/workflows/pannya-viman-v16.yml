name: Pannya Viman V1.6 Book Store Native APK
on:
  push:
    branches: [pannya-viman-v16-bookstore]
    paths: [.github/workflows/pannya-viman-v16.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download verified V1.6 native source
        run: |
          curl -fLSs --retry 3 --retry-delay 3 'https://drive.google.com/uc?export=download&id=1USqoFkbPdrvToJYDhpMpaqMnq8HHzuFG' -o source.zip
          echo '88f6dc671597ca5e840a54bc6cd739095399b355b2e7eb6ff3e27717681f3e7a  source.zip' | sha256sum -c -
          mkdir android && cd android && unzip -q ../source.zip
          python3 scripts/preflight.py
          grep -q "versionName '1.6.0'" app/build.gradle
          grep -q 'void bookStore()' app/src/main/java/asia/aaii/pannyaviman/MainActivity.java
          grep -q 'void purchaseDialog()' app/src/main/java/asia/aaii/pannyaviman/BookActivity.java
      - name: Build Native Installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -3
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PannyaViman-V1.6-BookStore-Native-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
