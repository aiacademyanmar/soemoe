name: Buddha Psychology V1.3 APK Build
on:
  push:
    branches: [build/buddha-psychology-v1.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download V1.3 source privately from Drive backup
        env:
          SOURCE_DRIVE_ID: 1NV8oKwT5RfpvhZ0fKEBZPPD4j7hT3exM
        run: |
          python3 -m pip install --disable-pip-version-check gdown==5.2.0
          gdown "https://drive.google.com/uc?id=${SOURCE_DRIVE_ID}" --output project.zip
          python3 - <<'PY'
          import os,zipfile
          with zipfile.ZipFile('project.zip') as z:
              bad=z.testzip()
              if bad: raise RuntimeError('Bad zip file: '+bad)
              z.extractall('project')
          root='project/BuddhaPsychologyNative_V1_3/app/src/main/assets'
          assert os.path.isfile(root+'/book.pdf')
          assert len([f for f in os.listdir(root+'/audio') if f.endswith('.mp3')]) == 8
          PY
      - name: Compile APK
        working-directory: project/BuddhaPsychologyNative_V1_3
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Print APK digest
        run: sha256sum project/BuddhaPsychologyNative_V1_3/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddha-Psychology-V1.3-debug-APK
          path: project/BuddhaPsychologyNative_V1_3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
