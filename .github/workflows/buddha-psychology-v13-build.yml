name: Buddha Psychology V1.6.1 Provider and Mood UI APK Build
on:
  push:
    branches: [build/buddha-psychology-v1.6.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK on runner
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore versioned project from Drive
        env:
          SOURCE_ID: 1nkotBu090T0aNUvpQBEINXo62jUoEOJC
        run: |
          python3 -m pip install --disable-pip-version-check gdown==5.2.0
          gdown "https://drive.google.com/uc?id=${SOURCE_ID}" --output source.zip
          python3 - <<'PY'
          import os,zipfile,json,pathlib
          with zipfile.ZipFile('source.zip') as z:
              assert z.testzip() is None
              z.extractall('project')
          root=pathlib.Path('project/BuddhaPsychologyNative_V1_6_1')
          assert (root/'app/src/main/assets/book.pdf').is_file()
          assert len(list((root/'app/src/main/assets/audio').glob('track_*.mp3')))==9
          mood=json.loads((root/'app/src/main/assets/mood_catalog.json').read_text(encoding='utf8'))
          assert mood['total']==240 and len(mood['categories'])==16
          assert all(len(x['states'])==15 for x in mood['categories'])
          j=root/'app/src/main/java/asia/aaii/buddhapsychology'
          chat=(j/'AiChatActivity.java').read_text(encoding='utf8')
          catalog=(j/'MoodCatalogActivity.java').read_text(encoding='utf8')
          assert 'ClipData.newPlainText' in chat and 'Intent.ACTION_VIEW' in chat
          assert 'https://chatgpt.com/' in chat and 'https://gemini.google.com/app' in chat
          assert 'HTTPS AI Server URL (တစ်ကြိမ်သာ ထည့်ရန်)' not in chat
          assert 'PremiumLicense.require(this,"ai",0' in chat
          assert 'colors[mood.cat%colors.length]' in catalog
          assert (j/'PremiumLicense.java').is_file()
          assert not any(x.suffix=='.epub' for x in (root/'app/src/main/assets').rglob('*'))
          PY
      - name: Build Android debug APK
        working-directory: project/BuddhaPsychologyNative_V1_6_1
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Report APK digest
        run: sha256sum project/BuddhaPsychologyNative_V1_6_1/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buddha-Psychology-V1.6.1-Provider-Mood-APK
          path: project/BuddhaPsychologyNative_V1_6_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
