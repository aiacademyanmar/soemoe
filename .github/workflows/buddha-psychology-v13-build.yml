name: Buddha Psychology V1.4.0 APK Build
on:
  push:
    branches: [build/buddha-psychology-v1.4.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK on GitHub Ubuntu runner
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download V1.4.0 source from Drive backup
        env:
          SOURCE_DRIVE_ID: 1QoYavRUlqUZqzOznYQF4vY3AoZo1GHJx
        run: |
          python3 -m pip install --disable-pip-version-check gdown==5.2.0
          gdown "https://drive.google.com/uc?id=${SOURCE_DRIVE_ID}" --output project.zip
          python3 - <<'PY'
          import os,zipfile
          with zipfile.ZipFile('project.zip') as z:
              bad=z.testzip()
              if bad: raise RuntimeError('Bad zip file: '+bad)
              z.extractall('project')
          root='project/BuddhaPsychologyNative_V1_4_0/app/src/main/assets'
          assert os.path.isfile(root+'/book.pdf')
          catalogue=open('project/BuddhaPsychologyNative_V1_4_0/app/src/main/java/asia/aaii/buddhapsychology/AudioCatalog.java',encoding='utf-8').read()
          assert 'ဗုဒ္ဓ၏ စိတ်ပညာနှင့် ခေတ်သစ်ဦးနှောက်သိပ္ပံ' in catalogue
          assert len([f for f in os.listdir(root+'/audio') if f.endswith('.mp3')]) == 9
          native=open('project/BuddhaPsychologyNative_V1_4_0/app/src/main/java/asia/aaii/buddhapsychology/NativeBookActivity.java',encoding='utf8').read()
          assert all(term in native for term in ['ScrollView', 'TextView', 'changeFont', 'changeLine', 'setGravity', 'showSection'])
          assert not os.path.exists(root+'/book_original.epub')
          assert not os.path.exists('project/BuddhaPsychologyNative_V1_4_0/app/src/main/java/asia/aaii/buddhapsychology/EpubReaderActivity.java')
          assert len([f for f in os.listdir(root+'/book_text') if f.startswith('section_') and f.endswith('.txt')]) == 10
          import json
          idx=json.load(open(root+'/book_text/index.json',encoding='utf8'))
          assert idx['source'].endswith('.html')
          assert idx['chapter_count'] == 9
          assert idx['section_count'] == 10
          assert all(os.path.isfile(root+'/book_text/headings_%02d.json'%n) for n in range(10))
          assert 'readStyledAsset' in native and 'SpannableStringBuilder' in native
          from pathlib import Path
          j=Path('project/BuddhaPsychologyNative_V1_4_0/app/src/main/java/asia/aaii/buddhapsychology')
          home=(j/'HomeActivity.java').read_text(encoding='utf-8')
          chapters=(j/'ChaptersActivity.java').read_text(encoding='utf-8')
          guide=(j/'BuddhaGuidanceActivity.java').read_text(encoding='utf-8')
          assert 'launch(this,ChaptersActivity.class)' in home
          assert 'for(int i=1;i<=9;i++)' in chapters
          assert 'reveal.setVisibility(View.GONE)' in native
          assert 'ClipboardManager' in guide
          catalog=(j/'AudioCatalog.java').read_text(encoding='utf8')
          assert catalog.count('new Track(')==9
          assert 'audio/track_09.mp3' in catalog
          assert 'အခန်း (၉) - ဗုဒ္ဓဘာသာ စိတ်ပညာ၏ လက်တွေ့ကျကျိုးကျေးဇူးများ' in catalog
          assert os.path.getsize(root+'/audio/track_09.mp3')>5000000
          assert not (j/'ChapterNineTtsActivity.java').exists()
          import json
          mood=json.load(open(root+'/mood_catalog.json',encoding='utf8'))
          assert mood['total']==240 and len(mood['categories'])==16
          assert sum(len(c['states']) for c in mood['categories'])==240
          chat=(j/'AiChatActivity.java').read_text(encoding='utf8')
          assert 'HttpURLConnection' in chat and 'https://' in chat
          assert 'activation_code' in chat and 'consent.isChecked()' in chat
          assert 'BuddhaGuidanceActivity' in (j/'HomeActivity.java').read_text(encoding='utf8')
          assert not any('OPENAI_API_KEY' in p.name for p in j.iterdir())
          assert os.path.exists('project/BuddhaPsychologyNative_V1_4_0/backend_php/chat.php')
          PY
      - name: Compile APK
        working-directory: project/BuddhaPsychologyNative_V1_4_0
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Print APK digest
        run: sha256sum project/BuddhaPsychologyNative_V1_4_0/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddha-Psychology-V1.4.0-debug-APK
          path: project/BuddhaPsychologyNative_V1_4_0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
