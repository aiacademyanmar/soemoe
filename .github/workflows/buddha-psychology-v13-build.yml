name: Buddha Psychology V1.6.2 Single AI 500 Courses
on:
  push:
    branches: [build/buddha-psychology-v1.6.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download full V1.6.2 project
        env:
          SOURCE_DRIVE_ID: 1dqeilXMDV6JVxzyvfKjWg65AMoNi6dii
        run: |
          python3 -m pip install --disable-pip-version-check gdown==5.2.0
          gdown "https://drive.google.com/uc?id=${SOURCE_DRIVE_ID}" --output source.zip
          python3 - <<'PY'
          import json,pathlib,zipfile
          with zipfile.ZipFile('source.zip') as z:
              assert z.testzip() is None
              z.extractall('project')
          root=pathlib.Path('project/BuddhaPsychologyNative_V1_6_2')
          assets=root/'app/src/main/assets'
          data=json.loads((assets/'psychology_courses_500.json').read_text(encoding='utf8'))
          assert data['total']==500 and len(data['tracks'])==20 and len(data['chapters'])==500
          assert sum(x['kind']=='Buddhist' for x in data['chapters'])==250
          assert sum(x['kind']=='International' for x in data['chapters'])==250
          assert len(set(x['prompt'] for x in data['chapters']))==500
          assert len(list((assets/'audio').glob('track_*.mp3')))==9
          assert (assets/'book.pdf').is_file()
          src=root/'app/src/main/java/asia/aaii/buddhapsychology'
          assert 'IDS={"psychology"}' in (src/'AiModules.java').read_text(encoding='utf8')
          assert 'ListView' in (src/'PsychologyCoursesActivity.java').read_text(encoding='utf8')
          assert 'lessonPrompt' in (src/'AiChatActivity.java').read_text(encoding='utf8')
          assert 'PremiumLicense.require' in (src/'PsychologyCoursesActivity.java').read_text(encoding='utf8')
          assert all(x in (root/'app/src/main/AndroidManifest.xml').read_text() for x in ['PsychologyCoursesActivity','PsychologyLessonActivity'])
          PY
      - name: Build APK
        working-directory: project/BuddhaPsychologyNative_V1_6_2
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: SHA256
        run: sha256sum project/BuddhaPsychologyNative_V1_6_2/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddha-Psychology-V1.6.2-Single-AI-500-Chapters
          path: project/BuddhaPsychologyNative_V1_6_2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
