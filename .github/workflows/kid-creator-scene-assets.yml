name: AAII Kid Creator Embed Approved Scene Artwork
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kid-creator-scene-assets.yml"
permissions:
  contents: write
jobs:
  import-lesson-scenes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download approved Myanmar 3D scene images
        shell: bash
        env:
          URL_SCENE01_WELCOME: "https://media.canva.com/v2/image-resize/format:JPG/height:92/quality:75/uri:ifs%3A%2F%2FM%2F654709b8-cf0e-48b9-ba1d-ba447eaef8ce/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJWAhaN7RrsupWuM8bBsTKRIu6BxymB5IdeNgIyF6G9z&exp=1792704518&osig=AAAAAAAAAAAAAAAAAAAAAEVclJ0WBCTnZxp-GIGgnXhSHsmWOxmnUE0E1IQmWiH7&signer=media-rpc&token=AAIAAU0AJDY1NDcwOWI4LWNmMGUtNDhiOS1iYTFkLWJhNDQ3ZWFlZjhjZQAAAAABoWWEF3De_2fgInp3KIBsSjL6ehLwosqNJxYG6zwI5pxX-Dc6jA&x-canva-quality=thumbnail"
          URL_SCENE02_INTRO: "https://media.canva.com/v2/image-resize/format:JPG/height:76/quality:75/uri:ifs%3A%2F%2FM%2F1d9f5779-b953-4272-8f5f-e814504b8151/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAL2IvgzgYOVe6caM-Ovk5ZxqJe6FlBnJ4vRBOM_qU7bZ&exp=1792703733&osig=AAAAAAAAAAAAAAAAAAAAAGqbloBnA1qgBtvTHi2fJP5cj-sKyqwsd9L96VRZRguM&signer=media-rpc&token=AAIAAU0AJDFkOWY1Nzc5LWI5NTMtNDI3Mi04ZjVmLWU4MTQ1MDRiODE1MQAAAAABoWV4HQiD9ZIpdvFSg1h5ILjaIqplVGv89UftFiGW-p45Tk4Xyg&x-canva-quality=thumbnail"
          URL_SCENE03_AI: "https://media.canva.com/v2/image-resize/format:JPG/height:127/quality:75/uri:ifs%3A%2F%2FM%2F53088cad-64c7-49e4-85a7-517ebba9d52b/watermark:F/width:188?csig=AAAAAAAAAAAAAAAAAAAAACIdV_X-didmOu_WLyAdAtxCureFZaOa9O1rXoHfQEZV&exp=1792702176&osig=AAAAAAAAAAAAAAAAAAAAAGOcR9Qp-YI-0tNemKgklNCP8CbfvyGMN8eS_YtTLEn2&signer=media-rpc&token=AAIAAU0AJDUzMDg4Y2FkLTY0YzctNDllNC04NWE3LTUxN2ViYmE5ZDUyYgAAAAABoWVgWwAYvehlRUSLilieSkhN-QOn3VTLMVrXRX_gNWN14OhdUA&x-canva-quality=thumbnail"
          URL_SCENE04_HUMAN: "https://media.canva.com/v2/image-resize/format:JPG/height:127/quality:75/uri:ifs%3A%2F%2FM%2Fc8fbb88d-5bc6-4797-ba88-5580ddf6dcd1/watermark:F/width:189?csig=AAAAAAAAAAAAAAAAAAAAAAKRThSvFvUFJM7YZYVAh72D5IBfldxx_FTgcpIi2kkB&exp=1792704588&osig=AAAAAAAAAAAAAAAAAAAAAPWEf_xMdONcHRtg3XBEmTGuXeSXWA4YHeNaJ7arXAAC&signer=media-rpc&token=AAIAAU0AJGM4ZmJiODhkLTViYzYtNDc5Ny1iYTg4LTU1ODBkZGY2ZGNkMQAAAAABoWWFKOCIPW7NE2IMMBQM9AoVcFhK9jANwpJUVusux_iBHz-gXw&x-canva-quality=thumbnail"
          URL_SCENE05_LEARNING: "https://media.canva.com/v2/image-resize/format:JPG/height:64/quality:75/uri:ifs%3A%2F%2FM%2F65735fb1-387b-43da-abcc-d76dd9ebf65e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAL05lKa9YURkynJhr3t_KvvFRE7OpVjyIDHuQGY1ldqA&exp=1792701204&osig=AAAAAAAAAAAAAAAAAAAAAFl8EitOwSkUIdhhLCBuejE6amcSIwCC_PxjARNPCRc9&signer=media-rpc&token=AAIAAU0AJDY1NzM1ZmIxLTM4N2ItNDNkYS1hYmNjLWQ3NmRkOWViZjY1ZQAAAAABoWVRhiDPYNQ43Cl6Xl1FirdMOdhxCzqaFxxc0cNYBTDRwe_QDQ&x-canva-quality=thumbnail"
          URL_SCENE06_DAILY: "https://media.canva.com/v2/image-resize/format:JPG/height:78/quality:75/uri:ifs%3A%2F%2FM%2F59536dbe-fc90-46fb-8dfa-7971e7f3e136/watermark:F/width:199?csig=AAAAAAAAAAAAAAAAAAAAALrPlb3azjk5OWMDj7sGt_ZfCMPNL-ULWo0YPz87rII5&exp=1792703606&osig=AAAAAAAAAAAAAAAAAAAAAOln_DEUBAe_XBuqyU5ry_dekibnJ_C7WM5c8nNkCRAn&signer=media-rpc&token=AAIAAU0AJDU5NTM2ZGJlLWZjOTAtNDZmYi04ZGZhLTc5NzFlN2YzZTEzNgAAAAABoWV2LPCLCpzJ3cFFxrEQYBCel0rwNCMe6W1xHPlFpgiRLwo_Pg&x-canva-quality=thumbnail"
          URL_SCENE07_PROMPT: "https://media.canva.com/v2/image-resize/format:JPG/height:151/quality:75/uri:ifs%3A%2F%2FM%2Fb5bd6942-2f6f-4211-adf8-dc6adf07ff2f/watermark:F/width:148?csig=AAAAAAAAAAAAAAAAAAAAAKdb5xmz2R359W8F8R9it05CdCulAPODYEidJijVFWKq&exp=1792702537&osig=AAAAAAAAAAAAAAAAAAAAAJQEiZt6rkDwkySZIvKV6tDNWG04KhrYIw63IDpq_7hP&signer=media-rpc&token=AAIAAU0AJGI1YmQ2OTQyLTJmNmYtNDIxMS1hZGY4LWRjNmFkZjA3ZmYyZgAAAAABoWVl3Shhth5vDszEq0vTCalB2WLnnW97T0d5VjUQ8yDj_BPZDQ&x-canva-quality=thumbnail"
          URL_SCENE08_SAFETY: "https://media.canva.com/v2/image-resize/format:JPG/height:157/quality:75/uri:ifs%3A%2F%2FM%2Fe2eb9ed1-3163-4723-8d92-2c5fcaa5338a/watermark:F/width:155?csig=AAAAAAAAAAAAAAAAAAAAAEKbmZ1BWPVP4EBCrIvK8iUAUqOPpHveMa1V2fsshXHt&exp=1792701704&osig=AAAAAAAAAAAAAAAAAAAAABlKaTi9eb0bJ_XnddC8wS5KXLEnmwgfzye9vyZ6u8aM&signer=media-rpc&token=AAIAAU0AJGUyZWI5ZWQxLTMxNjMtNDcyMy04ZDkyLTJjNWZjYWE1MzM4YQAAAAABoWVZJ0DcedjVfWWCp0ykKeGJsaAtyTI2m_pFg88UEygYvtJPXw&x-canva-quality=thumbnail"
          URL_SCENE09_QUIZ: "https://media.canva.com/v2/image-resize/format:JPG/height:139/quality:75/uri:ifs%3A%2F%2FM%2Ffec94a78-b77b-46e1-a778-539a9bec3d9f/watermark:F/width:197?csig=AAAAAAAAAAAAAAAAAAAAALYlTtiv4ShGWnM3tBYHCgSaEz3ZsexwXkF5Ks8FCSZH&exp=1792702610&osig=AAAAAAAAAAAAAAAAAAAAABnSKbCduv9eGUzUjmw1afjKJPMrKFV4RFyIdtWG563C&signer=media-rpc&token=AAIAAU0AJGZlYzk0YTc4LWI3N2ItNDZlMS1hNzc4LTUzOWE5YmVjM2Q5ZgAAAAABoWVm-lAHFDGNOVj-FIiFAJSuNdFxHp_Yr55N72OKL4xTC4QFig&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          fetch_image() {
            local url="$1" dest="$2"
            curl --connect-timeout 10 --retry 2 --max-time 40 -fLsS "$url" -o "$dest"
            file "$dest"
            file "$dest" | grep -E 'JPEG image data|PNG image data'
            test -s "$dest"
          }
          fetch_image "$URL_SCENE01_WELCOME" "app/src/main/res/drawable-nodpi/lesson11_scene01_welcome.jpg"
          fetch_image "$URL_SCENE02_INTRO" "app/src/main/res/drawable-nodpi/lesson11_scene02_intro.jpg"
          fetch_image "$URL_SCENE03_AI" "app/src/main/res/drawable-nodpi/lesson11_scene03_ai.jpg"
          fetch_image "$URL_SCENE04_HUMAN" "app/src/main/res/drawable-nodpi/lesson11_scene04_human.jpg"
          fetch_image "$URL_SCENE05_LEARNING" "app/src/main/res/drawable-nodpi/lesson11_scene05_learning.jpg"
          fetch_image "$URL_SCENE06_DAILY" "app/src/main/res/drawable-nodpi/lesson11_scene06_daily.jpg"
          fetch_image "$URL_SCENE07_PROMPT" "app/src/main/res/drawable-nodpi/lesson11_scene07_prompt.jpg"
          fetch_image "$URL_SCENE08_SAFETY" "app/src/main/res/drawable-nodpi/lesson11_scene08_safety.jpg"
          fetch_image "$URL_SCENE09_QUIZ" "app/src/main/res/drawable-nodpi/lesson11_scene09_quiz.jpg"
      - name: Commit bundled illustrations (no remote dependencies at runtime)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/lesson11_scene*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(kidcreator): bundle nine exact approved 3D Myanmar scene illustrations"
          git push
