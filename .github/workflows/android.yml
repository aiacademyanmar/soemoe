name: DAMA TV V6 - Embedded YouTube Player
on:
  push:
    branches: ["dama-tv-inapp-v6"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode artwork from source assets
        run: |
          shopt -s nullglob
          for x in app/src/main/res/drawable-nodpi/*.jpg.b64; do base64 -d "$x" > "${x%.b64}"; done
          rm -f app/src/main/res/drawable-nodpi/*.jpg.b64
      - name: Validate 1894 book entries and format metadata
        run: |
          python3 - <<'PY'
          import gzip,json,collections
          b=json.loads(gzip.open('app/src/main/assets/books_catalog.json.gz','rb').read())
          assert len(b)==1894
          assert len(set(x['url'] for x in b))==1894
          assert collections.Counter(x['format'] for x in b)=={'PDF':1849,'DOC':45}
          assert len({x['author'] for x in b})>=50
          assert all(x['link_status']=='not_live_checked' for x in b)
          print('CATALOG OK: 1894 URLs, 1849 PDF, 45 DOC, unique author filters')
          PY
      - name: Remove superseded uncompressed asset
        run: rm -f app/src/main/assets/books_catalog.json
      - name: Rename compressed catalog to Android-packaged asset
        run: mv app/src/main/assets/books_catalog.json.gz app/src/main/assets/library_catalog.dat
      - name: Validate publisher MP3 samples (non-destructive checks)
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,random
          from pathlib import Path
          # Test only actual MP3 URLs present in the bundled seed list.
          tracks=json.loads(Path('app/src/main/assets/seed_tracks.json').read_text())
          tested=[]
          for t in tracks[:14]:
              url=t['url']
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'DAMA-Radio-QA/1.0','Range':'bytes=0-1023'})
                  with urllib.request.urlopen(req,timeout=8) as rsp:
                      ct=rsp.headers.get('Content-Type','')
                      start=rsp.read(1024)
                      ok=rsp.status in (200,206) and ('audio' in ct or start[:3]==b'ID3' or start[:2] in (b'\\xff\\xfb',b'\\xff\\xf3',b'\\xff\\xf2'))
                      tested.append({'url':url,'status':'reachable_audio_sample' if ok else 'response_not_verified_audio','http':rsp.status,'content_type':ct})
              except Exception as e:tested.append({'url':url,'status':'unavailable_or_unverified','error':str(e)[:150]})
          Path('mp3_playback_link_qa.json').write_text(json.dumps({'method':'HTTP range/first 1024 bytes, NOT full audio playback','tested_count':len(tested),'total_bundled_seed':len(tracks),'links':tested},ensure_ascii=False,indent=2))
          print('MP3 sample results', {k:sum(v['status']==k for v in tested) for k in set(v['status'] for v in tested)})
          PY
      - name: Decode DAMA TV assets
        run: |
          base64 -d app/src/main/assets/tv_catalog.json.gz.b64 > app/src/main/assets/tv_catalog.json.gz
          base64 -d app/src/main/res/drawable-nodpi/tv_banner.jpg.b64 > app/src/main/res/drawable-nodpi/tv_banner.jpg
          rm -f app/src/main/assets/tv_catalog.json.gz.b64 app/src/main/res/drawable-nodpi/tv_banner.jpg.b64
      - name: Verify DAMA TV video catalog
        run: |
          python3 - <<'PY'
          import gzip,json
          records=json.loads(gzip.open('app/src/main/assets/tv_catalog.json.gz','rb').read())
          assert len(records)==3264,len(records)
          assert len({v['id'] for v in records})==3264
          print('3264 unique YouTube video IDs bundled as offline metadata')
          PY
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify embedded data and APK consistency
        run: |
          python3 - <<'PY'
          import zipfile,gzip,json,os
          path='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            b=json.loads(gzip.decompress(z.read('assets/library_catalog.dat')))
            assert len(b)==1894
            assert 'classes.dex' in z.namelist()
          print('APK OK; catalog',len(b),'bytes',os.stat(path).st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DAMA-TV-V6-Android-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            mp3_playback_link_qa.json
          if-no-files-found: warn
          retention-days: 60