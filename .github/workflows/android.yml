name: DAMA APP V12 - Premium Library and Ebook Reader
on:
  push:
    branches: ["dama-library-premium-v12"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK 35
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode artwork from source assets
        run: |
          shopt -s nullglob
          for x in app/src/main/res/drawable-nodpi/*.jpg.b64; do base64 -d "$x" > "${x%.b64}"; done
          rm -f app/src/main/res/drawable-nodpi/*.jpg.b64
      - name: Validate 1894 book entries and format metadata
        run: |
          python3 - <<'PY'
          import gzip,json,collections
          b=json.loads(gzip.open('app/src/main/assets/books_catalog.json.gz','rb').read())
          assert len(b)>=1894
          assert len(set(x['url'] for x in b))==1894
          assert collections.Counter(x['format'] for x in b)=={'PDF':1849,'DOC':45}
          assert len({x['author'] for x in b})>=50
          assert all(x['link_status']=='not_live_checked' for x in b)
          print('CATALOG OK: 1894 URLs, 1849 PDF, 45 DOC, unique author filters')
          PY
      - name: Merge indexed Google Drive books into offline catalog
        run: |
          python3 - <<'PY'
          import json,gzip,glob,os,re
          p='app/src/main/assets/books_catalog.json.gz'
          books=json.load(gzip.open(p,'rt',encoding='utf-8'))
          ids={x['url'] for x in books}
          names={(x['title'].strip().lower(),x.get('author','').strip().lower()) for x in books}
          added=0
          for fn in sorted(glob.glob('drive_import/batch_*.json')):
            for folder in json.load(open(fn,encoding='utf-8')):
              parent=folder['parent']['title']
              for f in folder.get('items',[]):
                if f['mime'] != 'application/pdf': continue
                url=f.get('url','')
                if not url or url in ids: continue
                title=f['title'].removesuffix('.pdf').strip()
                key=(title.lower(),parent.lower())
                if key in names: continue
                text=title+' '+parent
                if 'ပဋ္ဌာန်း' in text or 'ပဋ္ဌာန' in text: category='ပဋ္ဌာန်း'
                elif 'အဘိဓမ္မာ' in text: category='အဘိဓမ္မာ'
                elif 'ဝိပဿနာ' in text: category='ဝိပဿနာ'
                elif 'ပိဋက' in text: category='ပိဋကတ်သုံးပုံ'
                elif 'ပါဠိ' in text: category='ပါဠိ'
                elif 'ပရိတ်' in text: category='ပရိတ်/ဝတ်ရွတ်'
                else: category='ဓမ္မစာအုပ်'
                books.append({'id':'drive_'+f['id'],'title':title,'author':parent,'category':category,'format':'PDF','url':url,'listing_url':folder['parent']['url'],'link_status':'not_live_checked','author_type':'person_label','source':'google_drive'})
                added+=1;ids.add(url);names.add(key)
          with gzip.open(p,'wt',encoding='utf-8') as z:json.dump(books,z,ensure_ascii=False)
          assert len(books)>=1894
          print('MERGED',len(books),'DRIVE ADDED',added)
          PY
      - name: Remove superseded uncompressed asset
        run: rm -f app/src/main/assets/books_catalog.json
      - name: Rename compressed catalog to Android-packaged asset
        run: mv app/src/main/assets/books_catalog.json.gz app/src/main/assets/library_catalog.dat
      - name: Bundle Offline DAMA TV Catalog
        run: |
          base64 -d app/src/main/assets/tv_catalog.json.gz.b64 > app/src/main/assets/tv_catalog.json.gz
          rm app/src/main/assets/tv_catalog.json.gz.b64
      - name: Verify all three module catalogs
        run: |
          python3 - <<'PY'
          import gzip,json
          books=json.load(gzip.open('app/src/main/assets/library_catalog.dat','rt',encoding='utf8'))
          videos=json.load(gzip.open('app/src/main/assets/tv_catalog.json.gz','rt',encoding='utf8'))
          audio=json.load(open('app/src/main/assets/seed_tracks.json',encoding='utf8'))
          assert len(books)>=1894 and len(videos)==3264
          assert len({v['id'] for v in videos})==3264
          assert len(audio)>=14
          print('VERIFIED RADIO seed:',len(audio),'LIBRARY:',len(books),'TV:',len(videos))
          PY
      - name: Verify Reader footer integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/asia/aaii/dama')
          footer=(root/'FooterNav.java').read_text()
          reader=(root/'ReaderShelfActivity.java').read_text()
          assert 'Home","Radio","Library","Reader","TV' in footer
          assert 'PdfReaderActivity.class' in reader
          assert 'DAMA-Library' in reader
          assert 'FooterNav.attach(this,root,"Home")' in (root/'HomeActivity.java').read_text()
          assert 'FooterNav.attach(this,main,"Library")' in (root/'LibraryActivity.java').read_text()
          assert '.ReaderShelfActivity' in Path('app/src/main/AndroidManifest.xml').read_text()
          print('DAMA V9 navigation and offline Reader integration checked')
          PY
      - name: Bundle 12973 MP3 catalog links
        run: |
          base64 -d app/src/main/assets/radio_catalog.dat.b64 > app/src/main/assets/radio_catalog.dat
          rm app/src/main/assets/radio_catalog.dat.b64
          python3 - <<'PY'
          import gzip,json
          p=json.load(gzip.open('app/src/main/assets/radio_catalog.dat','rt',encoding='utf-8'))
          assert len(p)==12973 and len({v['url'] for v in p})==12973
          print('Bundled',len(p),'offline MP3 links')
          PY
      - name: Verify Player UI opens before network media setup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('app/src/main/java/asia/aaii/dama/MainActivity.java').read_text()
          play=src.split('  void play(Track track){',1)[1].split('  void openPlayerPreview(){',1)[0]
          assert play.index('show("Playing")') < play.index('prepareTrackAsync(')
          assert 'list.setOnItemClickListener((p,v,index,id)->play(results.get(index)))' in src
          assert 'dama_test_player_ui' in src
          assert 'FooterNav.attach' in src
          print('PLAYER UI FIRST, row-tap-to-play and footer navigation verified')
          PY
      - name: Probe publisher MP3 links (small HTTP Range, non-blocking)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          links=json.load(open('app/src/main/assets/seed_tracks.json'))
          for item in links[:5]:
              url=item['url']
              req=urllib.request.Request(url,headers={'Range':'bytes=0-1023','User-Agent':'Mozilla/5.0 (DAMA Player Healthcheck)'})
              try:
                  with urllib.request.urlopen(req,timeout=10) as res:
                      status=res.status;type_=res.headers.get('Content-Type','unknown')
                      print('MP3 CHECK',item['id'],status,type_,res.url)
              except Exception as e:
                  print('MP3 CHECK',item['id'],'NOT REACHABLE',repr(e)[:250])
          PY
      - name: Decode premium DAMA Library artwork
        run: |
          base64 -d app/src/main/res/drawable-nodpi/dama_library_v12_hero.jpg.b64 > app/src/main/res/drawable-nodpi/dama_library_v12_hero.jpg
          rm app/src/main/res/drawable-nodpi/dama_library_v12_hero.jpg.b64
      - name: Verify premium Library UI and unified Footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('app/src/main/java/asia/aaii/dama')
          a=(root/'LibraryActivity.java').read_text()
          b=(root/'PdfReaderActivity.java').read_text()
          c=(root/'FooterNav.java').read_text()
          assert 'dama_library_v12_hero' in a
          assert 'FooterNav.attach(this,main,"Library")' in a
          assert 'FooterNav.attach(this,rootLayout,"Reader")' in b
          assert 'Home","Radio","Library","Reader","TV' in c
          print("Premium Library + EBook Reader menus verified")
          PY
      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify embedded data and APK consistency
        run: |
          python3 - <<'PY'
          import zipfile,gzip,json,os
          path='app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            b=json.loads(gzip.decompress(z.read('assets/library_catalog.dat')))
            assert len(b)>=1894
            assert 'classes.dex' in z.namelist()
            assert 'assets/tv_catalog.json' in z.namelist()
            vids=json.loads(z.read('assets/tv_catalog.json'))
            assert len(vids)==3264
            mp3=json.loads(gzip.decompress(z.read('assets/radio_catalog.dat')))
            assert len(mp3)==12973
          print('APK OK; catalog',len(b),'bytes',os.stat(path).st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DAMA-APP-V12-Premium-Library-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            
          if-no-files-found: warn
          retention-days: 60