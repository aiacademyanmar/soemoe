name: AAII School V2.3 Windows + Android Pilot
on:
  push:
    branches: [school-v2-3-manual-sync]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch verified Android V2.3 source
        run: |
          python3 -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=19mXTt6wEylfsbcfr14e9p0HMSPqAASQY' -O android-source.zip
          echo '9ad5e6f678323f1137f6d2a2bf32e728874d3124a9049bf27fb22cdbaa46b4f6  android-source.zip' | sha256sum --check
          unzip -q android-source.zip
      - name: Build Android APK
        run: gradle --no-daemon -p AAII_School_Offline_Android_V2.3 assembleDebug
      - name: Verify APK
        run: |
          test -s AAII_School_Offline_Android_V2.3/app/build/outputs/apk/debug/app-debug.apk
          sha256sum AAII_School_Offline_Android_V2.3/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-School-Offline-V2.3-APK
          path: AAII_School_Offline_Android_V2.3/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Fetch verified Windows source
        shell: pwsh
        run: |
          python -m pip install --quiet gdown
          python -m gdown 'https://drive.google.com/uc?id=1bC9ydxIBaJWXN2RiAjbCxE4m-D59D5XQ' -O windows-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $expected='c649c9f2526692b2237ff8d4915e0c7a7f15f7ea0ebfaf5bc7fb17c4e8d92e7f'
          if ((Get-FileHash windows-source.zip -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Checksum mismatch' }
          Expand-Archive -Path windows-source.zip -DestinationPath .
      - name: Test and Build Windows EXE
        shell: pwsh
        run: |
          Set-Location AAII_School_Windows_Native_V2.3/src
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o AAII_School_Windows_V2.3_Native_x64.exe .
          if ($LASTEXITCODE -ne 0) { throw 'EXE build failed' }
      - name: GUI process startup smoke test
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'AAII_School_Windows_Native_V2.3/src/AAII_School_Windows_V2.3_Native_x64.exe').Path
          $env:AAII_SMS_DATA_DIR=Join-Path $env:RUNNER_TEMP 'school-v23-data'
          New-Item -ItemType Directory -Path $env:AAII_SMS_DATA_DIR -Force | Out-Null
          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited) { throw "App exited early ($($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-School-Windows-V2.3-EXE
          path: AAII_School_Windows_Native_V2.3/src/AAII_School_Windows_V2.3_Native_x64.exe
