name: AAII School 21 Modules Offline Native APK V2.0
on:
  push:
    branches: [school-offline-21-modules-v2]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK on Ubuntu Runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch verified source package
        run: |
          python3 -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=10Ovr3uA7nJ5DDobmNHRVbHu2bgAMKoCk' -O school-v2-source.zip
          echo '06324cab7e8ee2906bd8eac06674e706311832d224c7ce4266cb5414610a37d2  school-v2-source.zip' | sha256sum -c -
          unzip -q school-v2-source.zip
      - name: Compile native APK
        run: gradle --no-daemon -p AAII_School_Offline_21Modules_V2.0 assembleDebug
      - name: Verify APK and SHA256
        run: |
          test -s AAII_School_Offline_21Modules_V2.0/app/build/outputs/apk/debug/app-debug.apk
          sha256sum AAII_School_Offline_21Modules_V2.0/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AAII-School-Offline-21Modules-V2.0-APK
          path: AAII_School_Offline_21Modules_V2.0/app/build/outputs/apk/debug/app-debug.apk
