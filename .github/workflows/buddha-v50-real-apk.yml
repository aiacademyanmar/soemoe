name: Buddha Psychology V5.0 Genuine APK
on:
  push:
    branches:
      - build/buddha-psychology-v5.0
  pull_request:
    paths:
      - 'buddha-v50/**'
      - '.github/workflows/buddha-v50-real-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK using preinstalled sdkmanager
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore original offline content from verified Buddha V1.6.5 GitHub artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/buddha-original
          gh run download 41144156116 --repo aiacademyanmar/soemoe --name Buddha-Psychology-V1.6.5-Certificate-Fix-APK --dir /tmp/buddha-original
          find /tmp/buddha-original -type f -maxdepth 3
          python3 - <<'PYASSET'
          import zipfile,pathlib
          source=next(pathlib.Path('/tmp/buddha-original').rglob('*.apk'))
          dest=pathlib.Path('buddha-v50/app/src/main')
          with zipfile.ZipFile(source) as z:
              wanted=[x for x in z.namelist() if x.startswith('assets/') and (x.endswith('.mp3') or x.endswith('.pdf') or x.endswith('.json') or x.endswith('.txt'))]
              for name in wanted:
                  path=dest/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(z.read(name))
              for original,target in [('res/drawable-nodpi-v4/buddha_hero.jpg','buddha_hero.jpg'),('res/drawable-nodpi-v4/buddha_cover.jpg','buddha_cover.jpg')]:
                  out=dest/'res/drawable-nodpi'/target;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(z.read(original))
          aud=list((dest/'assets/audio').glob('*.mp3'))
          assert len(aud)==9, aud
          assert (dest/'assets/book.pdf').stat().st_size>1000000
          assert (dest/'assets/psychology_courses_500.json').stat().st_size>1000000
          print('Restored 9 MP3s, PDF, 500 chapter catalog, book text, and original Buddha images.')
          PYASSET
      - name: Compile Android V5.0 Debug APK
        working-directory: buddha-v50
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK structure and full offline assets
        run: |
          set -euo pipefail
          APK=buddha-v50/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 6
          python3 - <<'PYVERIFY'
          import zipfile,pathlib
          p=pathlib.Path('buddha-v50/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(p) as z:
              aud=[i for i in z.infolist() if i.filename.startswith('assets/audio/') and i.filename.endswith('.mp3')]
              assert len(aud)==9, len(aud)
              assert all(i.compress_type==zipfile.ZIP_STORED for i in aud),'MP3 must be uncompressed for MediaPlayer'
              for x in ['assets/book.pdf','assets/psychology_courses_500.json','assets/book_text/section_09.txt']:assert x in z.namelist(),x
              print('Verified actual APK:',p.stat().st_size,'bytes; 9 uncompressed MP3s')
          PYVERIFY
          sha256sum "$APK" > buddha-v50/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Buddha-Psychology-V5.0-Compiled-Debug-APK
          path: |
            buddha-v50/app/build/outputs/apk/debug/app-debug.apk
            buddha-v50/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
