name: Sukha Panya V8.3 MEDICINE Library APK
on:
  push:
    branches: [sukha-v83-medical-library-update]
    paths: ['sukha-v83/**', '.github/workflows/sukha-v83-apk.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Merge library into V8.2 native source
        run: |
          set -euo pipefail
          unzip -q sukha-v82/source.zip -d sukha-v83
          mkdir -p sukha-v83/android/app/src/main/java/asia/aaii/sukhapanya/
          cp sukha-v83/LibraryActivity.java sukha-v83/android/app/src/main/java/asia/aaii/sukhapanya/LibraryActivity.java
          python3 - <<'PY'
          from pathlib import Path
          base=Path('sukha-v83/android/app/src/main')
          m=base/'AndroidManifest.xml'
          s=m.read_text()
          assert '</application>' in s
          s=s.replace('</application>','<activity android:name=".LibraryActivity" android:exported="false" /></application>')
          m.write_text(s)
          p=base/'java/asia/aaii/sukhapanya/MainActivity.java'
          s=p.read_text()
          key='screenFrame.post(this::putTapTargets);hideBars();'
          assert key in s,'V8.2 source changed; safe patch refused'
          s=s.replace(key,'screenFrame.post(() -> { putTapTargets(); addLibraryEntry(); });hideBars();')
          idx=s.rfind('}')
          assert idx>0
          s=s[:idx]+'''
          private void addLibraryEntry(){
             android.widget.Button btn=new android.widget.Button(this);
             btn.setAllCaps(false);btn.setText("📚 MEDICINE • 30 ကျမ်း");
             btn.setTextSize(12);btn.setTextColor(0xffffffff);btn.setBackgroundTintList(android.content.res.ColorStateList.valueOf(0xff105d44));
             android.widget.FrameLayout.LayoutParams lp=new android.widget.FrameLayout.LayoutParams(
               (int)(getResources().getDisplayMetrics().density*175),
               (int)(getResources().getDisplayMetrics().density*45));
             lp.gravity=android.view.Gravity.RIGHT|android.view.Gravity.TOP;lp.topMargin=(int)(getResources().getDisplayMetrics().density*18);
             lp.rightMargin=(int)(getResources().getDisplayMetrics().density*9);
             screenFrame.addView(btn,lp);btn.bringToFront();
             btn.setOnClickListener(v->startActivity(new android.content.Intent(this,LibraryActivity.class)));
          }
          '''+s[idx:]
          p.write_text(s)
          p=base/'java/asia/aaii/sukhapanya/LibraryActivity.java'
          s=p.read_text().replace('final EditText old=(EditText)body.getChildAt(3);','')
          p.write_text(s)
          print('Screens:',len(list((base/'assets').glob('screen_*.webp'))))
          assert len(list((base/'assets').glob('screen_*.webp')))==14
          PY
      - name: Compile APK
        working-directory: sukha-v83/android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify artifact
        run: |
          set -e
          APK=sukha-v83/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify --verbose "$APK"
          cp "$APK" SukhaPanya_V8_3_Medicine_Library.apk
          sha256sum SukhaPanya_V8_3_Medicine_Library.apk > SukhaPanya_V8_3_Medicine_Library.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SukhaPanya-V83-Medicine-Library-APK
          path: |
            SukhaPanya_V8_3_Medicine_Library.apk
            SukhaPanya_V8_3_Medicine_Library.apk.sha256
          retention-days: 30
          if-no-files-found: error
