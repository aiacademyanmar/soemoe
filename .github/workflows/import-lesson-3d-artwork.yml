name: Import Myanmar 3D Lesson Artwork
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-lesson-3d-artwork.yml"
permissions:
  contents: write
jobs:
  embed-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download reference artwork into Android project
        env:
          IMG_HI: "https://media.canva.com/v2/image-resize/format:PNG/height:1536/quality:100/uri:ifs%3A%2F%2FM%2F7bb1e9e9-f1a1-4223-9cd6-3bfcc3696baa/watermark:F/width:1024?csig=AAAAAAAAAAAAAAAAAAAAADIBMEKuFYW4wvT058WXHUywUmYXZEVMqeY8Kbv_ga1C&exp=1792700338&osig=AAAAAAAAAAAAAAAAAAAAAJmfKftvOkReYoBn6BIonjNYSWg2LMsreuUpbR_2HN25&signer=media-rpc&token=AAIAAU0AJDdiYjFlOWU5LWYxYTEtNDIyMy05Y2Q2LTNiZmNjMzY5NmJhYQAAAAABoWVET1DR5esQB2I4NHG5_y__fAlBOsWNcoc6YvgOlkNmBMkwLQ&x-canva-quality=original"
          IMG_MID: "https://media.canva.com/v2/image-resize/format:PNG/height:768/quality:100/uri:ifs%3A%2F%2FM%2F7bb1e9e9-f1a1-4223-9cd6-3bfcc3696baa/watermark:F/width:512?csig=AAAAAAAAAAAAAAAAAAAAADIBMEKuFYW4wvT058WXHUywUmYXZEVMqeY8Kbv_ga1C&exp=1792700338&osig=AAAAAAAAAAAAAAAAAAAAAJmfKftvOkReYoBn6BIonjNYSWg2LMsreuUpbR_2HN25&signer=media-rpc&token=AAIAAU0AJDdiYjFlOWU5LWYxYTEtNDIyMy05Y2Q2LTNiZmNjMzY5NmJhYQAAAAABoWVET1DR5esQB2I4NHG5_y__fAlBOsWNcoc6YvgOlkNmBMkwLQ&x-canva-quality=thumbnail"
          IMG_LOW: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F7bb1e9e9-f1a1-4223-9cd6-3bfcc3696baa/watermark:F/width:133?csig=AAAAAAAAAAAAAAAAAAAAADIBMEKuFYW4wvT058WXHUywUmYXZEVMqeY8Kbv_ga1C&exp=1792700338&osig=AAAAAAAAAAAAAAAAAAAAAJmfKftvOkReYoBn6BIonjNYSWg2LMsreuUpbR_2HN25&signer=media-rpc&token=AAIAAU0AJDdiYjFlOWU5LWYxYTEtNDIyMy05Y2Q2LTNiZmNjMzY5NmJhYQAAAAABoWVET1DR5esQB2I4NHG5_y__fAlBOsWNcoc6YvgOlkNmBMkwLQ&x-canva-quality=thumbnail"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          DEST="app/src/main/res/drawable-nodpi/lesson11_reference.png"
          for KEY in IMG_HI IMG_MID IMG_LOW; do
            URL="${!KEY}"
            echo "Trying ${KEY} ..."
            if curl --connect-timeout 10 --max-time 40 -fLsS "${URL}" -o "${DEST}.part"; then
              if file "${DEST}.part" | grep -q 'PNG image data'; then
                mv "${DEST}.part" "${DEST}"
                file "${DEST}"
                ls -lh "${DEST}"
                break
              fi
            fi
          done
          test -s "${DEST}" || { echo "No accessible reference artwork"; exit 1; }
      - name: Commit embedded artwork (offline usable)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/lesson11_reference.png
          if git diff --cached --quiet; then echo "Asset already in repository"; exit 0; fi
          git commit -m "assets(android): embed user's Myanmar 3D classroom illustration"
          git push
